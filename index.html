<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokoKita - E-Commerce Multi Vendor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
button,input,select{font:inherit}.hidden{display:none!important}.top{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:800}.top nav{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 15px;cursor:pointer;background:#111;color:#fff}.btn.light{background:#eee;color:#111}.btn.danger{background:#c62828}.hero{padding:70px 20px;text-align:center;background:#e9edff}.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:#555}.wrap{max-width:1100px;margin:35px auto;padding:0 20px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:14px}.pic{height:160px;border-radius:9px;background:#e8e8e8;display:grid;place-items:center;color:#888}.price{font-weight:800;font-size:18px}.card .btn{width:100%;margin-top:10px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{background:#fff;padding:28px;border-radius:15px;width:min(420px,100%);box-shadow:0 10px 35px #0001}.box input,.box select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}.box .btn{width:100%;margin-top:10px}.dashboard{min-height:calc(100vh - 64px);display:grid;grid-template-columns:230px 1fr}.side{background:#111;color:#fff;padding:22px}.side h2{margin-top:0}.menu{padding:12px 6px;border-bottom:1px solid #333;cursor:pointer}.content{padding:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;padding:20px;border:1px solid #ddd;border-radius:12px}.stat b{font-size:27px;display:block;margin-top:6px}.table{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-top:20px}.cart{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;border-radius:50px;padding:14px 18px;cursor:pointer;z-index:10}
@media(max-width:800px){.products{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:1fr}.side{display:flex;gap:10px;overflow:auto}.side h2{display:none}.menu{white-space:nowrap;border:0}.hero h1{font-size:30px}}
@media(max-width:480px){.products{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top nav .hide{display:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <h1>🛍️ TokoKita</h1><p>Demo E-Commerce Multi Vendor</p>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <select id="role"><option value="customer">Customer</option><option value="seller">Seller</option><option value="admin">Admin</option></select>
    <button class="btn" onclick="login()">Masuk</button>
    <button class="btn light" onclick="guest()">Lihat sebagai tamu</button>
  </div>
</div>

<div id="site" class="hidden">
<header class="top"><div class="logo">🛍️ TokoKita</div><nav><button class="btn light hide" onclick="showShop()">Belanja</button><button class="btn light" onclick="openCart()">🛒 <span id="count">0</span></button><button class="btn" onclick="logout()">Keluar</button></nav></header>

<section id="shop">
  <div class="hero"><h1>Marketplace Pilihanmu</h1><p>Belanja dari berbagai seller dalam satu website.</p></div>
  <div class="wrap"><h2>Produk</h2><div id="products" class="products"></div></div>
</section>

<section id="dash" class="hidden"></section>
</div>

<div id="cart" class="hidden" style="position:fixed;inset:0;background:#0008;z-index:20;padding:20px">
 <div class="box" style="margin:50px auto"><h2>🛒 Keranjang</h2><div id="cartItems"></div><h3 id="total"></h3><button class="btn" onclick="checkout()">Checkout</button> <button class="btn light" onclick="closeCart()">Tutup</button></div>
</div>

<script>
const products=[
{id:1,name:"Sneakers Urban",price:299000,seller:"Toko Sport"},
{id:2,name:"Kaos Premium",price:129000,seller:"Fashion Kita"},
{id:3,name:"Headset Wireless",price:399000,seller:"Tech Store"},
{id:4,name:"Tas Casual",price:189000,seller:"Fashion Kita"},
{id:5,name:"Jam Tangan",price:249000,seller:"Style Shop"},
{id:6,name:"Keyboard Mechanical",price:599000,seller:"Tech Store"},
{id:7,name:"Botol Minum",price:89000,seller:"Daily Goods"},
{id:8,name:"Hoodie Basic",price:219000,seller:"Fashion Kita"}];
let cart=[], currentRole="customer";
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function renderProducts(){document.getElementById("products").innerHTML=products.map(p=>`<article class="card"><div class="pic">Foto Produk</div><h3>${p.name}</h3><small>${p.seller}</small><p class="price">${rp(p.price)}</p><button class="btn" onclick="add(${p.id})">Tambah ke Keranjang</button></article>`).join("")}
function login(){currentRole=document.getElementById("role").value;document.getElementById("login").classList.add("hidden");document.getElementById("site").classList.remove("hidden");if(currentRole==="customer")showShop();else showDashboard(currentRole)}
function guest(){currentRole="customer";document.getElementById("login").classList.add("hidden");document.getElementById("site").classList.remove("hidden");showShop()}
function logout(){location.reload()}
function showShop(){document.getElementById("shop").classList.remove("hidden");document.getElementById("dash").classList.add("hidden");renderProducts()}
function add(id){cart.push(products.find(p=>p.id===id));updateCount()}
function updateCount(){document.getElementById("count").textContent=cart.length}
function openCart(){document.getElementById("cart").classList.remove("hidden");let total=cart.reduce((s,p)=>s+p.price,0);document.getElementById("cartItems").innerHTML=cart.length?cart.map((p,i)=>`<p>${i+1}. ${p.name} — ${rp(p.price)}</p>`).join(""):"<p>Keranjang masih kosong.</p>";document.getElementById("total").textContent="Total: "+rp(total)}
function closeCart(){document.getElementById("cart").classList.add("hidden")}
function checkout(){if(!cart.length)return alert("Keranjang kosong.");alert("Demo checkout berhasil! Pembayaran asli akan ditambahkan nanti.");cart=[];updateCount();closeCart()}
function showDashboard(role){document.getElementById("shop").classList.add("hidden");let d=document.getElementById("dash");d.classList.remove("hidden");let data=role==="seller"?{title:"Seller Dashboard",menus:["Dashboard","Produk","Tambah Produk","Pesanan","Penjualan","Toko"],stats:[["Produk","24"],["Pesanan","18"],["Terjual","156"],["Pendapatan","Rp 8.450.000"]]}:{title:"Admin Dashboard",menus:["Dashboard","Customer","Seller","Produk","Pesanan","Kategori","Laporan"],stats:[["Customer","1.250"],["Seller","86"],["Produk","4.820"],["Pesanan","3.540"]]};d.innerHTML=`<main class="dashboard"><aside class="side"><h2>${role==="seller"?"🏪 Seller":"🛡️ Admin"}</h2>${data.menus.map(x=>`<div class="menu">${x}</div>`).join("")}</aside><section class="content"><h1>${data.title}</h1><div class="stats">${data.stats.map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join("")}</div><div class="table"><h2>Aktivitas Terbaru</h2><p>Belum ada data real. Template ini siap dikembangkan dengan database dan autentikasi.</p></div></section></main>`}
renderProducts();
</script>
</body></html>
